<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10243a">
<meta name="description" content="매일 30분, 실전 영어와 제조업 영어를 함께 공부하는 개인 영어 학습 앱">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>MY ENGLISH</title>
<style>
:root{--navy:#10243a;--blue:#2463eb;--bg:#f3f6fa;--ink:#172334;--muted:#66758a;--line:#e2e8f0;--green:#16845b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
header{background:var(--navy);color:#fff;padding:22px 18px 18px}header .top{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0;letter-spacing:.5px}header p{margin:7px 0 0;color:#c5d2e0;font-size:13px}
main{max-width:760px;margin:auto;padding:16px 14px 40px}.hero{background:#fff;border-radius:18px;padding:17px;box-shadow:0 4px 18px #14263b0d;margin-top:-2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted);font-size:13px}.big{font-size:26px;font-weight:800}.bar{height:9px;background:#e8edf4;border-radius:20px;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;background:var(--blue);width:0}
.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0 12px}.tab{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:20px;white-space:nowrap;font-size:13px;color:#40516a}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}.panel h2{font-size:17px;margin:0 0 10px}.panel h3{font-size:14px;margin:14px 0 6px}.word{padding:11px 0;border-bottom:1px solid #edf1f5}.word:last-child{border:0}.en{font-weight:700;font-size:16px}.ko{color:var(--muted);font-size:13px;margin-top:3px}.example{background:#f5f8fc;padding:11px;border-radius:10px;margin-top:7px;font-size:14px;line-height:1.5}
button{border:0;border-radius:11px;background:var(--blue);color:white;padding:11px 14px;font-size:14px;font-weight:650;cursor:pointer}button.secondary{background:#edf2f8;color:#26374d}button.dark{background:var(--navy)}button:disabled{opacity:.4}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.question{font-weight:700;line-height:1.5}.textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;resize:vertical}
.notice{font-size:12px;color:var(--muted);line-height:1.55}.pill{font-size:11px;background:#eaf1ff;color:#2456bd;padding:4px 8px;border-radius:20px}
select{padding:9px;border:1px solid var(--line);border-radius:9px;background:white}
footer{text-align:center;color:var(--muted);font-size:11px;margin:25px 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#15263a;color:white;padding:11px 16px;border-radius:20px;display:none;font-size:13px;z-index:9}
@media(min-width:600px){main{padding:22px}.panel{padding:20px}}
</style>
</head>
<body>
<header><div class="top"><h1>MY ENGLISH</h1><span class="pill">DAILY 30 MIN</span></div><p>실전 회화 · 제조업 영어 · SPA 대비</p></header>
<main>
<section class="hero">
 <div class="row"><div><div class="muted">현재 학습 진도</div><div class="big" id="dayTitle">DAY 1</div></div><div style="text-align:right"><div class="muted">완료한 학습</div><div class="big" id="progressText">0 / 30</div></div></div>
 <div class="bar"><span id="progressBar"></span></div>
 <div class="row"><span class="muted" id="streakText">오늘도 30분 영어 습관을 시작해 보세요.</span><select id="daySelect" aria-label="학습 일차"></select></div>
</section>
<nav class="tabs" id="tabs">
 <button class="tab active" data-tab="words">핵심 단어</button><button class="tab" data-tab="sentences">실용 문장</button><button class="tab" data-tab="listening">듣기</button><button class="tab" data-tab="speaking">말하기</button><button class="tab" data-tab="spa">SPA</button><button class="tab" data-tab="quiz">복습 퀴즈</button>
</nav>
<div id="content"></div>
<div class="actions"><button class="secondary" id="prevBtn">이전 DAY</button><button id="completeBtn">오늘 학습 완료</button><button class="secondary" id="nextBtn">다음 DAY</button></div>
<p class="notice">학습 진도는 이 휴대폰의 브라우저에 저장됩니다. 브라우저 데이터 삭제 또는 기기 변경 시 진도가 사라질 수 있습니다. 음성 기능은 Chrome 등 지원 브라우저와 인터넷 연결 상태에 따라 달라질 수 있습니다.</p>
<footer>MY ENGLISH · 꾸준한 반복이 실력을 만듭니다.</footer>
</main><div id="toast"></div>
<script src="lessons.js"></script>
<script>
const $=s=>document.querySelector(s);
let day=Number(localStorage.getItem('myeng_day')||1), tab='words';
let completed=JSON.parse(localStorage.getItem('myeng_done')||'[]');
let answers=JSON.parse(localStorage.getItem('myeng_answers')||'{}');
const daySelect=$('#daySelect');
LESSONS.forEach((l,i)=>{let o=document.createElement('option');o.value=i+1;o.textContent=`DAY ${i+1} · ${l.topic}`;daySelect.append(o)});
function save(){localStorage.setItem('myeng_day',day);localStorage.setItem('myeng_done',JSON.stringify(completed));localStorage.setItem('myeng_answers',JSON.stringify(answers))}
function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2100)}
function speak(t,rate=.88){if(!('speechSynthesis'in window)){toast('이 브라우저는 음성 읽기를 지원하지 않습니다.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}
function startRecognition(target){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('음성 인식은 Android Chrome에서 이용해 주세요.');return}let r=new SR();r.lang='en-US';r.interimResults=false;r.onresult=e=>{target.value+=(target.value?' ':'')+e.results[0][0].transcript;target.dispatchEvent(new Event('input'))};r.onerror=()=>toast('음성 인식에 실패했습니다. 마이크 권한을 확인해 주세요.');r.start()}
function render(){
 let l=LESSONS[day-1];$('#dayTitle').textContent='DAY '+day;$('#progressText').textContent=completed.length+' / 30';$('#progressBar').style.width=(completed.length/30*100)+'%';$('#streakText').textContent=completed.includes(day)?'이 DAY 학습을 완료했습니다. 복습도 해보세요.':'오늘의 주제: '+l.topic;daySelect.value=day;
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 let c=$('#content');
 if(tab==='words')c.innerHTML=`<section class="panel"><h2>핵심 어휘 10개</h2><p class="muted">단어를 누르거나 듣기 버튼으로 발음을 익히세요.</p>${l.words.map(w=>`<div class="word"><div class="row"><div><div class="en">${w[0]}</div><div class="ko">${w[1]} · ${w[2]}</div></div><button class="secondary" data-say="${w[0]}">발음 듣기</button></div></div>`).join('')}</section>`;
 if(tab==='sentences')c.innerHTML=`<section class="panel"><h2>실용 문장 5개</h2>${l.sentences.map(s=>`<div class="word"><div class="en">${s[0]}</div><div class="ko">${s[1]}</div><div class="example">${s[2]}</div><div class="actions"><button class="secondary" data-say="${s[0]}">문장 듣기</button></div></div>`).join('')}</section>`;
 if(tab==='listening')c.innerHTML=`<section class="panel"><h2>듣기 연습</h2><p class="muted">먼저 영어만 듣고 내용을 파악한 뒤 대본을 확인하세요.</p><div class="example" style="white-space:pre-line">${l.dialogue.map(x=>x[0]+': '+x[1]).join('\n')}</div><div class="actions"><button data-say="${l.dialogue.map(x=>x[1]).join('. ')}" data-rate=".82">대화 전체 듣기</button><button class="secondary" onclick="$('#script').hidden=!$('#script').hidden">대본 보기/숨기기</button></div><div id="script" hidden><h3>대화 해석</h3>${l.dialogue.map(x=>`<p><b>${x[0]}:</b> ${x[2]}</p>`).join('')}</div></section>`;
 if(tab==='speaking')c.innerHTML=`<section class="panel"><h2>말하기 훈련</h2><p class="question">${l.speaking[0]}</p><p class="muted">${l.speaking[1]}</p><textarea class="textarea" id="answer" placeholder="영어로 직접 답변을 작성하거나 음성 입력을 사용하세요.">${answers[day]||''}</textarea><div class="actions"><button onclick="startRecognition($('#answer'))">🎙 음성으로 답변</button><button class="secondary" onclick="speak($('#answer').value)">내 답변 듣기</button><button onclick="saveAnswer()">답변 저장</button></div><h3>답변 구성 힌트</h3><p class="muted">${l.speaking[2]}</p><p class="notice">작성한 답변을 ChatGPT에 붙여 넣으면 문법, 어휘, 자연스러움까지 교정받을 수 있습니다.</p></section>`;
 if(tab==='spa')c.innerHTML=`<section class="panel"><h2>SPA 스타일 질문</h2><p class="question">${l.spa[0]}</p><p class="muted">${l.spa[1]}</p><div class="example">${l.spa[2]}</div><div class="actions"><button class="secondary" data-say="${l.spa[2]}">예시 답변 듣기</button></div></section>`;
 if(tab==='quiz')c.innerHTML=`<section class="panel"><h2>복습 퀴즈</h2><p class="question">${l.quiz[0]}</p>${l.quiz[1].map((q,i)=>`<div class="word"><b>${i+1}. ${q[0]}</b><div>${q[1].map((a,j)=>`<label style="display:block;padding:5px"><input type="radio" name="q${i}" value="${j}"> ${a}</label>`).join('')}</div></div>`).join('')}<button onclick="grade()">정답 확인</button><div id="quizResult" class="example" hidden></div></section>`;
c.querySelectorAll('[data-say]').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.say,Number(b.dataset.rate||.88))));
}
function saveAnswer(){answers[day]=$('#answer').value;save();toast('답변을 저장했습니다.')}
function grade(){let l=LESSONS[day-1],score=0;l.quiz[1].forEach((q,i)=>{let v=document.querySelector(`input[name=q${i}]:checked`);if(v&&Number(v.value)===q[2])score++});let e=$('#quizResult');e.hidden=false;e.textContent=`${l.quiz[1].length}문제 중 ${score}개 정답입니다. ${score===l.quiz[1].length?'완벽합니다!':'틀린 문제는 단어와 문장을 다시 확인해 보세요.'}`}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));
daySelect.addEventListener('change',()=>{day=Number(daySelect.value);save();render()});
$('#completeBtn').addEventListener('click',()=>{if(!completed.includes(day))completed.push(day);save();render();toast('DAY '+day+' 학습 완료!')});
$('#prevBtn').addEventListener('click',()=>{day=Math.max(1,day-1);save();render()});
$('#nextBtn').addEventListener('click',()=>{day=Math.min(30,day+1);save();render()});
render();
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
